[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oncemore"
version = "1.2.0"
description = "DVD-Video authoring with menus, chapters and ISO output (CLI core)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "oncemore contributors" }]
keywords = ["dvd", "dvd-video", "authoring", "ffmpeg", "iso"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = []

[project.scripts]
oncemore = "oncemore.cli:main"

[project.urls]
Homepage = "https://github.com/kajisho5/oncemore"

[tool.setuptools]
packages = ["oncemore", "oncemore.gui", "oncemore._vendor", "oncemore._vendor.vtskit",
            "oncemore._vendor.udfkit", "oncemore._vendor.dvdcc",
            "oncemore._vendor.bdmvkit"]

[tool.setuptools.package-data]
oncemore = ["project.schema.json", "webplayer/*"]
"oncemore._vendor.vtskit" = ["UPSTREAM", "COPYING.LESSER"]
"oncemore._vendor.udfkit" = ["UPSTREAM", "LICENSE", "NOTICE"]
"oncemore._vendor.dvdcc" = ["UPSTREAM", "LICENSE", "NOTICE"]
"oncemore._vendor.bdmvkit" = ["UPSTREAM", "COPYING", "COPYING.LESSER"]
"oncemore.gui" = ["static/*"]
