<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>oncemore</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <div id="menurow" class="menurow">
    <nav id="menubar" class="menubar" role="menubar" aria-label="Menu bar"></nav>
    <div class="spacer"></div>
    <div id="disc-name" class="disc-name"></div>
    <div id="save-state" class="save-state"></div>
  </div>
  <div id="toolbar" class="toolbar">
    <span class="grip" aria-hidden="true"></span>
    <div id="tools" class="tools" role="toolbar" aria-label="Tools"></div>
    <div class="spacer"></div>
    <label class="ws-label" for="workspaces"><span data-i18n="workspace">Workspace</span>:</label>
    <select id="workspaces" class="ws-select" aria-label="Workspace"></select>
    <input id="search" class="search" type="search" aria-label="Search" placeholder="⌕">
  </div>
</header>
<div id="layout" class="workspace">
  <section id="p-left" class="panel frame" data-frame="left">
    <header class="panel-head tabbar" id="left-tabs"></header>
    <nav id="sidebar" class="panel-body"></nav>
  </section>
  <div class="splitter v" data-split="left" title="Drag to resize"></div>
  <section id="p-center" class="panel center frame" data-frame="center">
    <header class="panel-head tabbar" id="center-head"></header>
    <main id="main" class="panel-body"></main>
  </section>
  <div class="splitter v" data-split="right" title="Drag to resize"></div>
  <section id="p-right" class="panel frame-column">
    <section id="p-props" class="frame" data-frame="props">
      <header class="panel-head tabbar" id="right-head"></header>
      <aside id="inspector" class="panel-body"></aside>
    </section>
    <section id="p-layers" class="frame" data-frame="layers">
      <header class="panel-head tabbar" id="layers-head"></header>
      <div id="layers" class="panel-body"></div>
      <div id="library" class="panel-body" hidden></div>
    </section>
  </section>
  <div class="splitter h" data-split="timeline" id="tl-splitter"></div>
  <section id="p-timeline" class="tl-panel frame" data-frame="timeline">
    <header class="panel-head tabbar" id="tl-head"></header>
    <div id="tl" class="panel-body"></div>
  </section>
</div>
<footer id="statusbar"></footer>
<div id="pv-window" class="float-window" role="dialog" hidden>
  <div class="fw-title"><span id="pv-title"></span><span class="spacer"></span><button class="icon fw-close" id="pv-close" title="Close">✕</button></div>
  <div id="pv-body" class="fw-body"></div>
</div>
<div id="drop-overlay" hidden><div data-i18n="drop_here">Drop files to add them to the project</div></div>
<div id="modal" hidden><div class="modal-card"><button class="icon modal-close">✕</button><div id="modal-body"></div></div></div>
<script src="app.js"></script>
</body>
</html>
