# The project site (site/) on GitHub Pages: https://kajisho5.github.io/oncemore/
# Needs Settings > Pages > Build and deployment > Source: GitHub Actions (once).
name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "oncemore/gui/static/favicon.svg", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Put the site together
        # the pages, then the pictures they share with the README (one copy in the repository)
        run: |
          mkdir -p _site/images
          cp -R site/. _site/
          cp docs/images/*.png _site/images/
          cp -R docs/images/logo _site/images/logo
          rm -f _site/images/logo/make_logo.py
          cp oncemore/gui/static/favicon.svg _site/images/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
