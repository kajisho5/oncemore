name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg dvdauthor genisoimage xorriso libdvdnav4 fonts-dejavu-core fonts-noto-cjk
      - name: Browser test dependencies (Playwright, test-only)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m oncemore doctor
      - name: Unit + end-to-end + GUI tests
        run: python -m unittest -v
      - name: Completion check (init + iso, no edits)
        run: |
          cd "$RUNNER_TEMP"
          python -m oncemore init demo
          python -m oncemore iso demo/project.oncemore.json -o demo.iso
          ls -l demo.iso
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Package installs and runs
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP" && oncemore --version && oncemore validate --no-media "$GITHUB_WORKSPACE/examples/basic"

  macos:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install external tools (Homebrew)
        run: brew install ffmpeg-full dvdauthor xorriso libdvdnav
      - run: python -m oncemore doctor
      - name: Unit + end-to-end tests (ISO via hdiutil)
        run: python -m unittest -v

  macos-app:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # CFBundleVersion = commit count
      - name: External tools for the smoke test
        run: brew install ffmpeg-full dvdauthor
      - name: Build Oncemore.app
        run: macos/build_app.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test (launch the app on a sample project)
        run: macos/smoke_test.sh dist/Oncemore.app
      - uses: actions/upload-artifact@v6
        with:
          name: Oncemore-macOS-arm64
          path: dist/Oncemore-*.zip
          if-no-files-found: error
