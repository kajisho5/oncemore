name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ubuntu:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install external tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg genisoimage xorriso libdvdnav4 libbluray2 fonts-dejavu-core fonts-noto-cjk
      - name: Browser test dependencies (Playwright, test-only)
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - run: python -m oncemore doctor
      - name: Unit + end-to-end + GUI tests
        run: python -m unittest -v
      - name: Completion check (init + iso, no edits)
        run: |
          cd "$RUNNER_TEMP"
          python -m oncemore init demo
          python -m oncemore iso demo/project.oncemore.json -o demo.iso
          ls -l demo.iso
        env:
          PYTHONPATH: ${{ github.workspace }}
      - name: Package installs and runs
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP" && oncemore --version && oncemore validate --no-media "$GITHUB_WORKSPACE/examples/basic"

  macos:
    timeout-minutes: 30
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install external tools (Homebrew)
        run: brew install ffmpeg-full xorriso libdvdnav libbluray
      - run: python -m oncemore doctor
      - name: Unit + end-to-end tests (ISO via hdiutil)
        run: python -m unittest -v

  macos-app:
    timeout-minutes: 45   # the first build of the app's ffmpeg, before the cache
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # CFBundleVersion = commit count
      - name: Tools to build the app's ffmpeg
        run: brew install meson ninja pkgconf
      - name: The app's ffmpeg, built before (macos/build_ffmpeg.sh)
        uses: actions/cache@v4
        with:
          path: dist/.cache/ffmpeg
          key: ffmpeg-${{ runner.os }}-arm64-${{ hashFiles('macos/build_ffmpeg.sh') }}
      - name: Xcode 26 or later (actool reads the layered icon)
        run: |
          x="$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$x" ]; then
            echo "DEVELOPER_DIR=$x/Contents/Developer" >> "$GITHUB_ENV"
            DEVELOPER_DIR="$x/Contents/Developer" xcodebuild -version
          else
            xcodebuild -version
          fi
      - name: Build Oncemore.app
        run: macos/build_app.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Smoke test (launch the app on a sample project)
        run: macos/smoke_test.sh dist/Oncemore.app
      - name: Icon previews (Icon Composer's renderer)
        run: macos/icon_previews.sh dist/icon-previews
      - uses: actions/upload-artifact@v6
        with:
          name: Oncemore-icon-previews
          path: dist/icon-previews
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        with:
          name: Oncemore-macOS-arm64
          path: dist/Oncemore-*.zip
          if-no-files-found: error
