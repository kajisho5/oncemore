name: Release

# Push a tag "v<version>" (matching oncemore/__init__.py) to build the Mac app
# for Apple silicon and Intel and attach both zips to a draft GitHub Release.
#
# Signing and notarisation are used when these repository secrets exist;
# without them the app is ad-hoc signed (first launch needs "Open Anyway"):
#   MACOS_CERT_P12        base64 of the "Developer ID Application" .p12
#   MACOS_CERT_PASSWORD   password of that .p12
#   MACOS_SIGN_IDENTITY   e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "macos/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # CFBundleVersion = commit count
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' oncemore/__init__.py)"
          [ "$GITHUB_REF_NAME" = "v$v" ] || { echo "tag $GITHUB_REF_NAME != v$v"; exit 1; }
      - name: External tools for the smoke test
        run: brew install ffmpeg-full dvdauthor
      - name: Signing certificate (if configured)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then
            echo "no signing secrets: building an ad-hoc signed app"
            exit 0
          fi
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(uuidgen)"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=$MACOS_SIGN_IDENTITY" >> "$GITHUB_ENV"
          if [ -n "$APPLE_ID" ]; then echo "NOTARIZE=1" >> "$GITHUB_ENV"; fi
      - name: Build Oncemore.app
        run: macos/build_app.sh
        env:
          ARCH: ${{ matrix.arch }}
          GH_TOKEN: ${{ github.token }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Smoke test (launch the app on a sample project)
        run: macos/smoke_test.sh dist/Oncemore.app
      - uses: actions/upload-artifact@v6
        with:
          name: Oncemore-macOS-${{ matrix.arch }}
          path: dist/Oncemore-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: Oncemore-macOS-*
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum Oncemore-*.zip > SHA256SUMS && cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/Oncemore-*.zip dist/SHA256SUMS \
            -R "$GITHUB_REPOSITORY" --draft --generate-notes --title "oncemore $GITHUB_REF_NAME"
